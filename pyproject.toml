[project]
name = "clashai"
version = "0.1.0"
description = "A bot that plays Clash Royale through an Android emulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "adbutils>=2.8",       # talk to the emulator/device over ADB (screenshots, taps, swipes)
    "opencv-python>=4.9",  # computer vision: template matching, image processing
    "numpy>=1.26",
    "pillow>=10.0",
    "python-dotenv>=1.0",  # load settings from .env
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
clashai = "clashai.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
